<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Formulario | Bran Construction</title>

    <!-- CSS general de tu página -->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- CSS exclusivo del formulario -->
    <link rel="stylesheet" href="css/form.css" />
  </head>

  <body class="form-page">

    <!-- ==========================================
         HEADER
    ========================================== -->

    <header class="header">
      <div class="container header-container">

        <!-- Logo -->
        <a href="index.html" class="logo">
          <img
            src="assets/logos/logo-bran.png"
            alt="Logotipo de Bran Construction"
          />
        </a>

        <!-- Navegación -->
        <nav
          class="navigation"
          aria-label="Navegación principal"
        >
          <ul class="navigation-list">

            <li>
              <a href="index.html#inicio">Inicio</a>
            </li>

            <li>
              <a href="index.html#servicios">Servicios</a>
            </li>

            <li>
              <a href="index.html#proyectos">Proyectos</a>
            </li>

            <li>
              <a href="index.html#contacto">Contacto</a>
            </li>

            <li>
              <a
                href="Form.html"
                class="nav-active"
              >
                Formulario
              </a>
            </li>

          </ul>
        </nav>

        <div class="header-actions">
          <a
            href="index.html"
            class="button button-header"
          >
            Regresar
          </a>
        </div>

      </div>
    </header>


    <!-- ==========================================
         CONTENIDO PRINCIPAL
    ========================================== -->

    <main class="form-main">

      <section class="employee-form-section">

        <div class="employee-form-container">

          <!-- ======================================
               FORMULARIO
          ======================================= -->

          <form
            class="employee-form"
            action="#"
            method="post"
          >

            <!-- ================================
                 DATOS PERSONALES
            ================================= -->

            <fieldset class="form-section">

              <legend>DATOS PERSONALES</legend>


              <!-- Documento -->
              <div class="employee-form-row">

                <label for="documento">
                  Documento de Identificación
                </label>

                <input
                  type="text"
                  id="documento"
                  name="documento"
                  required
                />

              </div>


              <!-- Nombre -->
              <div class="employee-form-row">

                <label for="nombre">
                  Nombre
                </label>

                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  required
                />

              </div>


              <!-- Dirección -->
              <div class="employee-form-row">

                <label for="direccion">
                  Dirección
                </label>

                <input
                  type="text"
                  id="direccion"
                  name="direccion"
                  required
                />

              </div>


              <!-- País -->
              <div class="employee-form-row">

                <label for="pais">
                  País
                </label>

                <input
                  type="text"
                  id="pais"
                  name="pais"
                  required
                />

              </div>


              <!-- Email -->
              <div class="employee-form-row">

                <label for="email">
                  E-Mail
                </label>

                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                />

              </div>

            </fieldset>


            <!-- ================================
                 DATOS LABORALES
            ================================= -->

            <fieldset class="form-section laboral-section">

              <legend>DATOS LABORALES</legend>


              <!-- Empresa -->
              <div class="employee-form-row">

                <label for="empresa">
                  Empresa
                </label>

                <input
                  type="text"
                  id="empresa"
                  name="empresa"
                  required
                />

              </div>


              <!-- Sueldo -->
              <div class="employee-form-row">

                <label for="sueldo">
                  Sueldo ordinario
                </label>

                <input
                  type="number"
                  id="sueldo"
                  name="sueldo"
                  min="0"
                  step="0.01"
                  required
                />

              </div>


              <!-- Bonificación -->
              <div class="employee-form-row">

                <label for="bonificacion">
                  Bonificación
                </label>

                <input
                  type="number"
                  id="bonificacion"
                  name="bonificacion"
                  min="0"
                  step="0.01"
                  required
                />

              </div>

            </fieldset>


            <!-- ================================
                 BOTÓN
            ================================= -->

            <div class="employee-form-button-container">

              <button
                type="submit"
                class="employee-form-button"
              >
                Enviar Datos
              </button>

            </div>

          </form>

        </div>

      </section>

    </main>

  </body>
</html>
