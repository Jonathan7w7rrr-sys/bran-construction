<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Iniciar sesión en el portal de clientes de Bran Construction."
    />

    <title>Iniciar sesión | Bran Construction</title>

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body>
    <!-- ==========================================
         HEADER
    ========================================== -->

    <header class="header">
      <div class="container header-container">
        <a href="index.html#inicio" class="logo">
          <img
            src="assets/logos/logo-bran.png"
            alt="Logotipo de Bran Construction"
          />
        </a>

        <nav class="navigation" aria-label="Navegación principal">
          <ul class="navigation-list">
            <li><a href="index.html#inicio">Inicio</a></li>
            <li><a href="index.html#servicios">Servicios</a></li>
            <li><a href="index.html#proyectos">Proyectos</a></li>
            <li><a href="index.html#contacto">Contacto</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <div class="header-auth">
            <a href="login.html">Iniciar sesión</a>
            <span class="header-auth-divider" aria-hidden="true">|</span>
            <a href="registro.html">Registrarse</a>
          </div>

          <a href="index.html#contacto" class="button button-header">
            Solicitar cotización
          </a>
        </div>
      </div>
    </header>

    <main>
      
           INICIO DE SESIÓN
    

      <section class="auth-page">
        <div class="container">
          <div class="auth-wrapper">
            <form class="auth-card">
              <p class="section-label">Portal de clientes</p>

              <h2>Iniciar sesión</h2>

              <p class="auth-subtitle">
                Ingresa tus datos para dar seguimiento a tu proyecto.
              </p>

              <div class="form-group">
                <label for="login-email">Correo</label>
                <input
                  type="email"
                  id="login-email"
                  name="correo"
                  required
                />
              </div>

              <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input
                  type="password"
                  id="login-password"
                  name="contrasena"
                  required
                />
              </div>

              <label class="auth-checkbox">
                <input type="checkbox" name="recordarme" />
                Recordarme
              </label>

              <button type="submit" class="button button-primary">
                Iniciar sesión
              </button>

              <p class="auth-switch">
                ¿No tienes cuenta?
                <a href="registro.html">Regístrate aquí</a>
              </p>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
