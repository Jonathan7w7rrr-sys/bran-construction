<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Crear una cuenta en el portal de clientes de Bran Construction."
    />

    <title>Registrarse | Bran Construction</title>

    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body>
    <!-- ==========================================
         HEADER
    ========================================== -->

    <header class="header">
      <div class="container header-container">
        <a href="index.html#inicio" class="logo">
          <img
            src="assets/logos/logo-bran.png"
            alt="Logotipo de Bran Construction"
          />
        </a>

        <nav class="navigation" aria-label="Navegación principal">
          <ul class="navigation-list">
            <li><a href="index.html#inicio">Inicio</a></li>
            <li><a href="index.html#servicios">Servicios</a></li>
            <li><a href="index.html#proyectos">Proyectos</a></li>
            <li><a href="index.html#contacto">Contacto</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <div class="header-auth">
            <a href="login.html">Iniciar sesión</a>
            <span class="header-auth-divider" aria-hidden="true">|</span>
            <a href="registro.html">Registrarse</a>
          </div>

          <a href="index.html#contacto" class="button button-header">
            Solicitar cotización
          </a>
        </div>
      </div>
    </header>

    <main>
      <!-- ==========================================
           REGISTRO
      ========================================== -->

      <section class="auth-page">
        <div class="container">
          <div class="auth-wrapper">
            <form class="auth-card">
              <p class="section-label">Portal de clientes</p>

              <h2>Crear cuenta</h2>

              <p class="auth-subtitle">
                Regístrate para dar seguimiento a tus proyectos con Bran
                Construction.
              </p>

              <div class="form-group">
                <label for="register-name">Nombre completo</label>
                <input
                  type="text"
                  id="register-name"
                  name="nombre"
                  required
                />
              </div>

              <div class="form-group">
                <label for="register-email">Correo</label>
                <input
                  type="email"
                  id="register-email"
                  name="correo"
                  required
                />
              </div>

              <div class="form-group">
                <label for="register-phone">Teléfono</label>
                <input type="tel" id="register-phone" name="telefono" required />
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="register-password">Contraseña</label>
                  <input
                    type="password"
                    id="register-password"
                    name="contrasena"
                    required
                  />
                </div>

                <div class="form-group">
                  <label for="register-password-confirm">
                    Confirmar contraseña
                  </label>
                  <input
                    type="password"
                    id="register-password-confirm"
                    name="confirmar_contrasena"
                    required
                  />
                </div>
              </div>

              <button type="submit" class="button button-primary">
                Registrarse
              </button>

              <p class="auth-switch">
                ¿Ya tienes cuenta?
                <a href="login.html">Inicia sesión aquí</a>
              </p>
            </form>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
